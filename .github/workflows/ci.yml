name: Build and test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - run: make CXX=${{ matrix.compiler }} all && make CXX=${{ matrix.compiler }} test
      - run: ./build/radar_sim --seed 3
